<title>Page introuvable — ASBL LAS</title>
<style>
  *{box-sizing:border-box}

  a{display:inline-block;width:100%;padding:13px 16px;border-radius:10px;background:#15803d;color:#fff;text-decoration:none;font-weight:700;font-size:.95rem}
  a:hover{background:#166534}
  .small{display:block;margin-top:16px;font-size:.8rem;color:#94a3b8}
</style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
